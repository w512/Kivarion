[package]
name = "Kivarion"
version = "1.4.0"
description = "Password manager that works with KDBX (KeePass) files"
authors = ["Nick Blokhin"]
license = "GPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kivarion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# `test` provides the mock runtime used to drive real IPC requests (raw body +
# headers) through the invoke handler in the tests at the bottom of lib.rs.
tauri = { version = "2", features = ["test"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Decodes the scalar arguments that ride along raw-byte IPC calls in headers
# (header values must be ISO-8859-1, paths routinely are not).
percent-encoding = "2"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-http = "2"
tauri-plugin-os = "2"
# KDBX 4 key derivation (see `crypto.rs`). It runs here rather than as WASM in
# the webview so it stays off the renderer's main thread. Only the low-level
# API is used, so the default `password-hash`/`rand` features are off;
# `zeroize` wipes the algorithm's memory blocks after each derivation.
# Pinned to the stable 0.5.x: multi-lane hashing (the `parallel` feature, on
# rayon) only exists in 0.6.0-rc, and a release-candidate crypto crate has no
# business on a password manager's critical path.
argon2 = { version = "0.5.3", default-features = false, features = [
    "alloc",
    "zeroize",
] }
# Wipes this side's copy of the key material once the derivation is done.
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
# PID liveness checks for save lock files without spawning `kill -0`.
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"

security-framework = "3.7.0"
# OSX_10_15 exposes kSecUseDataProtectionKeychain (biometric password storage).
security-framework-sys = { version = "2.17.0", features = ["OSX_10_15"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-local-authentication = "0.3"
block2 = "0.6"

